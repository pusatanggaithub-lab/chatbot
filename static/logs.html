<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log Tak Terjawab — Dashboard Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-4xl mx-auto p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-xl font-bold">Dashboard Chatbot</h1>
    <div id="keybox" class="flex gap-2"></div>
  </header>
  <nav id="nav" class="flex flex-wrap gap-1 mb-6 bg-white p-1.5 rounded-xl border border-slate-200"></nav>

  <h2 class="font-semibold mb-3">Pertanyaan yang belum terjawab</h2>
  <div id="list" class="grid gap-2"></div>
</div>
<div id="toast" style="display:none"></div>

<script src="app.js"></script>
<script>
renderShell('logs.html');

async function load() {
  try {
    const logs = await api('/api/logs');
    const listEl = document.getElementById('list');
    listEl.innerHTML = logs.length ? '' : '<p class="text-sm text-slate-500">Belum ada log.</p>';
    logs.forEach((l) => {
      const row = document.createElement('div');
      row.className = 'bg-white border border-slate-200 rounded-xl p-4 flex justify-between gap-3';
      row.innerHTML = `
        <div>
          <p class="text-sm">${l.pertanyaan}</p>
          <p class="text-xs text-slate-400 mt-1">${new Date(l.created_at).toLocaleString('id-ID')}${l.asal_url ? ' · ' + l.asal_url : ''}</p>
        </div>
        <button class="text-xs px-3 py-1 h-fit rounded border border-red-300 text-red-600">Hapus</button>`;
      row.querySelector('button').onclick = async () => {
        await api(`/api/logs/${l.id}`, { method: 'DELETE' });
        toast('Log dihapus'); load();
      };
      listEl.appendChild(row);
    });
  } catch (e) { toast(e.message, false); }
}
load();
</script>
</body>
</html>
