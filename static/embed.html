<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kode Embed — Dashboard Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-4xl mx-auto p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-xl font-bold">Dashboard Chatbot</h1>
    <div id="keybox" class="flex gap-2"></div>
  </header>
  <nav id="nav" class="flex flex-wrap gap-1 mb-6 bg-white p-1.5 rounded-xl border border-slate-200"></nav>

  <div class="bg-white border border-slate-200 rounded-xl p-5 grid gap-3">
    <h2 class="font-semibold">Pasang di website kamu</h2>
    <p class="text-sm text-slate-600">Tempel kode berikut tepat sebelum tag <code>&lt;/body&gt;</code>.</p>
    <pre id="code" class="bg-slate-900 text-teal-200 text-xs p-4 rounded-lg overflow-x-auto"></pre>
    <button id="copy" class="bg-teal-700 text-white text-sm px-4 py-2 rounded-lg w-fit">Salin kode</button>
  </div>

  <div class="mt-6 text-sm text-slate-600">
    Widget di bawah kanan halaman ini adalah pratinjau langsung.
  </div>
</div>
<div id="toast" style="display:none"></div>

<script src="app.js"></script>
<script>
renderShell('embed.html');

const snippet = `<script src="${location.origin}/widget.js" data-api-key="${getKey()}"><\/script>`;
document.getElementById('code').textContent = snippet;
document.getElementById('copy').onclick = () => {
  navigator.clipboard.writeText(snippet).then(() => toast('Kode disalin'));
};

// pratinjau widget
if (getKey()) {
  const s = document.createElement('script');
  s.src = '/widget.js';
  s.setAttribute('data-api-key', getKey());
  document.body.appendChild(s);
}
</script>
</body>
</html>
