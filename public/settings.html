<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tampilan Widget — Dashboard Chatbot</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
<div class="max-w-4xl mx-auto p-6">
  <header class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <h1 class="text-xl font-bold">Dashboard Chatbot</h1>
    <div id="keybox" class="flex gap-2"></div>
  </header>
  <nav id="nav" class="flex flex-wrap gap-1 mb-6 bg-white p-1.5 rounded-xl border border-slate-200"></nav>

  <form id="f" class="bg-white border border-slate-200 rounded-xl p-5 grid gap-4 max-w-lg">
    <label class="grid gap-1 text-sm">Nama Bot
      <input id="bot_name" class="border border-slate-300 rounded-lg px-3 py-2" required />
    </label>
    <label class="grid gap-1 text-sm">Warna Utama
      <input id="bot_color" type="color" class="h-10 w-20 border border-slate-300 rounded-lg" />
    </label>
    <label class="grid gap-1 text-sm">URL Foto Profil
      <input id="avatar_url" placeholder="https://..." class="border border-slate-300 rounded-lg px-3 py-2" />
    </label>
    <label class="grid gap-1 text-sm">Pesan Sambutan
      <textarea id="welcome_message" rows="2" class="border border-slate-300 rounded-lg px-3 py-2"></textarea>
    </label>
    <label class="grid gap-1 text-sm">Pesan Fallback (saat tidak ada FAQ cocok)
      <textarea id="fallback_message" rows="3" class="border border-slate-300 rounded-lg px-3 py-2"></textarea>
    </label>
    <button class="bg-teal-700 text-white text-sm px-4 py-2 rounded-lg w-fit">Simpan Pengaturan</button>
  </form>
</div>
<div id="toast" style="display:none"></div>

<script src="app.js"></script>
<script>
renderShell('settings.html');

async function load() {
  try {
    const p = await api('/api/profile');
    bot_name.value = p.bot_name;
    bot_color.value = p.bot_color;
    avatar_url.value = p.avatar_url || '';
    welcome_message.value = p.welcome_message;
    fallback_message.value = p.fallback_message;
  } catch (e) { toast(e.message, false); }
}

document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  try {
    await api('/api/profile', {
      method: 'PUT',
      body: JSON.stringify({
        bot_name: bot_name.value,
        bot_color: bot_color.value,
        avatar_url: avatar_url.value || null,
        welcome_message: welcome_message.value,
        fallback_message: fallback_message.value,
      }),
    });
    toast('Pengaturan tersimpan');
  } catch (e) { toast(e.message, false); }
};

load();
</script>
</body>
</html>
